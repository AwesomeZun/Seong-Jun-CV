<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>강성준 쇼릴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;700;900&family=Plus+Jakarta+Sans:ital,wght@0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
.stage{position:fixed;inset:0;display:grid;place-items:center;background:#000;cursor:pointer}
.stage canvas{display:block;width:min(100vw,calc(100vh * 16 / 9));height:auto;aspect-ratio:16/9;max-width:100%}
.stage.idle{cursor:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv" width="1920" height="1080" aria-label="강성준 쇼릴 15초 모션그래픽"></canvas>
</div>

<script>
(() => {
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1920, H = 1080, DUR = 15, TAU = Math.PI * 2, N = 1400;

/* ---------- palette ---------- */
const INK_BG = '#060A18', PAPER = '#F2F4F7', CARBON = '#0F1115', GRAPH = '#454C57', SLATE = '#6B7280';
const BLUE = '#34618C', Y = '#FBBF25', HUDC = '#8FA6D8', SOFT = '#9FB0D6';
const F = {
  han: '"Black Han Sans","Noto Sans KR",sans-serif',
  kr: '"Noto Sans KR","Apple SD Gothic Neo",sans-serif',
  en: '"Plus Jakarta Sans","Noto Sans KR",sans-serif',
  mono: '"JetBrains Mono",ui-monospace,Menlo,monospace'
};

/* ---------- language: ?lang=en for the English cut ---------- */
const EN = new URLSearchParams(location.search).get('lang') === 'en';
const HW = EN ? 800 : 900, HF = EN ? F.en : F.kr;
const T = EN ? {
  name: 'SEONG-JUN KANG', nameFont: `800 156px ${F.en}`, nameGap: 2, nameIn: .022, nameOut: .014, nameStep: 4,
  s1Top: 'COMPUTATIONAL IMMUNOLOGIST', s1TopFont: [800, 36, F.en], s1Sub: 'Ph.D. · SEOUL NATIONAL UNIVERSITY',
  s2Eye: 'RESEARCH PROFILE', s2: ['Immunology', 'Single-cell', 'spatial data'], s2Sub: 'From primary-cell assays to multimodal models',
  stats: [['papers', 'Papers'], ['first / co-first author', 'First author'], ['donor immune atlas', 'Donors'], ['in industry awards', 'Industry awards']],
  s3Right: 'SELECTED METRICS', coFirst: 'co-first', tag: 'Co-first author · In revision', s4Head: 'Where the work lands',
  s5: ['Measure it.', 'Model it.'], s6Eye: 'CAREER', s6Head: 'Trajectory',
  tl: [['Sungkyunkwan Univ.', 'B.S. Genetic Engineering'], ['Seoul National Univ.', 'M.S. Biomedical Sciences'], ['SNU Transplant Institute', 'Research personnel · NHP'],
       ['PB Immune Therapeutics', 'Manager · anti-CD40'], ['Ph.D., Seoul National Univ.', 'PB · Associate Director'], ['Yonsei Wonju Medicine', 'Postdoc · multimodal DL'], ['Boston, MA', 'Next chapter']],
  s7Eye: 'COMPUTATIONAL IMMUNOLOGIST', s7Sub: 'Single-cell & spatial multi-omics · Boston, MA'
} : {
  name: '강성준', nameFont: `400 300px ${F.han}`, nameGap: 14, nameIn: .06, nameOut: .04, nameStep: 6,
  s1Top: '계산 면역학자', s1TopFont: [700, 40, F.kr], s1Sub: 'SEONG-JUN KANG, Ph.D.',
  s2Eye: 'RESEARCH PROFILE · 연구 정체성', s2: ['실험 면역학', '단일세포·공간', '데이터 분석'], s2Sub: '일차 세포 실험부터 다중모달 분석까지',
  stats: [['편의 논문', '논문'], ['제1·공동 제1저자', '제1·공동 제1'], ['명 공여자 아틀라스', '공여자'], ['산업 과제 기획·수행', '산업 과제']],
  s3Right: '연구 성과', coFirst: '공동 제1저자', tag: '공동 제1저자 · 수정 중', s4Head: '게재 저널 18편',
  s5: ['측정부터', '모델까지'], s6Eye: 'TRAJECTORY', s6Head: '경력',
  tl: [['성균관대학교', '유전공학 학사'], ['서울대학교', '의과학 석사'], ['서울대 이식연구소', '전문연구요원 · 영장류 이식'],
       ['PB Immune Therapeutics', '매니저 · 항-CD40 과제'], ['서울대학교 의과학 박사', 'PB · Associate Director'], ['연세대 원주의과대학', '박사후연구원 · 다중모달 딥러닝'], ['Boston, MA', '다음 챕터']],
  s7Eye: 'SEONG-JUN KANG, Ph.D.', s7Sub: '계산 면역학자 · 단일세포·공간 멀티오믹스 · Boston, MA'
};

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const eOut3 = t => 1 - Math.pow(1 - t, 3);
const eOut5 = t => 1 - Math.pow(1 - t, 5);
const eIn3 = t => t * t * t;
const eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(20260925);
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };

/* ---------- immune clusters (UMAP layout) ---------- */
const CL = [
  { n: 'CD4⁺ Tn',   c: '#4C7DFF', x: 1085, y: 330, sx: 70, sy: 44, r: .5,  w: .17 },
  { n: 'Th1.17',    c: '#FF4D5E', x: 1275, y: 250, sx: 52, sy: 34, r: -.3, w: .10 },
  { n: 'Treg',      c: Y,         x: 1470, y: 335, sx: 58, sy: 40, r: .9,  w: .12 },
  { n: 'CD8⁺ Trm',  c: '#3BE38A', x: 1580, y: 545, sx: 48, sy: 78, r: .2,  w: .16 },
  { n: 'NK',        c: '#2FD8F0', x: 1590, y: 775, sx: 50, sy: 36, r: -.6, w: .09 },
  { n: 'B cell',    c: '#E04DFF', x: 1345, y: 830, sx: 66, sy: 36, r: .1,  w: .11 },
  { n: 'Monocyte',  c: '#FF7A45', x: 1080, y: 760, sx: 62, sy: 52, r: -.8, w: .14 },
  { n: 'cDC',       c: '#A3E635', x: 1200, y: 555, sx: 40, sy: 34, r: .3,  w: .11 }
];
const NEI = [1, 2, 0, 4, 3, 6, 7, 6];
const GRAY = 8;

function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function makeSprite(hex){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const [r, gg, b] = hexRgb(hex);
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(${(r + 255) >> 1},${(gg + 255) >> 1},${(b + 255) >> 1},1)`);
  gr.addColorStop(.22, `rgba(${r},${gg},${b},.95)`);
  gr.addColorStop(.5, `rgba(${r},${gg},${b},.26)`);
  gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
}
const SPR = CL.map(k => makeSprite(k.c)); SPR.push(makeSprite('#5A6A90'));

/* ---------- particle layouts ---------- */
const P = {
  c: new Uint8Array(N), dx: new Float32Array(N), dy: new Float32Array(N), z: new Float32Array(N),
  ux: new Float32Array(N), uy: new Float32Array(N), ph: new Float32Array(N), r: new Float32Array(N),
  hx: new Float32Array(N), hy: new Float32Array(N), hd: new Int8Array(N).fill(-1),
  nx: new Float32Array(N), ny: new Float32Array(N), rx: new Float32Array(N), ry: new Float32Array(N),
  s2x: new Float32Array(N), s2y: new Float32Array(N), s2s: new Float32Array(N), s2a: new Float32Array(N)
};
const cum = []; CL.reduce((a, k, i) => (cum[i] = a + k.w), 0);
for (let i = 0; i < N; i++){
  const q = rnd() * cum[cum.length - 1]; let c = 0; while (q > cum[c]) c++;
  P.c[i] = c; P.z[i] = rnd(); P.ph[i] = rnd() * TAU; P.r[i] = rnd();
  const rr = Math.sqrt(rnd()) * 1150, aa = rnd() * TAU;
  P.dx[i] = Math.cos(aa) * rr; P.dy[i] = Math.sin(aa) * rr * .62;
  const K = CL[c];
  if (rnd() < .09){
    const K2 = CL[NEI[c]], u = rnd();
    P.ux[i] = lerp(K.x, K2.x, u) + gauss() * 14; P.uy[i] = lerp(K.y, K2.y, u) + gauss() * 14;
  } else {
    const lx = gauss() * K.sx, ly = gauss() * K.sy, cs = Math.cos(K.r), sn = Math.sin(K.r);
    P.ux[i] = K.x + lx * cs - ly * sn; P.uy[i] = K.y + lx * sn + ly * cs;
  }
  const ra = rnd() * TAU, rd = 1150 + rnd() * 450;
  P.rx[i] = 960 + Math.cos(ra) * rd; P.ry[i] = 540 + Math.sin(ra) * rd * .7;
}
/* Visium-style hex grid in a tissue-shaped outline; 55 µm spots on a 100 µm pitch */
(function buildHex(){
  const cx = 1290, cy = 548, sp = 22, spots = [];
  for (let row = -30; row <= 30; row++){
    const y = cy + row * sp * .866;
    for (let col = -30; col <= 30; col++){
      const x = cx + col * sp + (row & 1 ? sp / 2 : 0);
      const dx = x - cx, dy = (y - cy) / .95, th = Math.atan2(dy, dx);
      const R = 400 * (1 + .12 * Math.sin(3 * th + 1) + .07 * Math.sin(5 * th + 2));
      if (Math.hypot(dx, dy) < R) spots.push([x, y]);
    }
  }
  for (let i = 0; i < Math.min(N, spots.length); i++){
    const [x, y] = spots[i]; P.hx[i] = x; P.hy[i] = y;
    const v = Math.sin(x * .008 + y * .004) + Math.cos(y * .011 - x * .003) * .8 + Math.hypot(x - cx, y - cy) / 420;
    P.hd[i] = clamp(Math.floor((v + 1.8) / 4.2 * 8), 0, 7);
  }
})();

/* ---------- particle state per time ---------- */
function drift(i, t){
  const imp = eIn3(inv(.3, .9, t));
  let f, th;
  if (t < .9){ f = (1 + .15 * t) * (1 - .86 * imp); th = .3 * t + .9 * imp; }
  else { const e = eOut5(inv(.9, 1.9, t)); f = .159 + 1.7 * (.6 + .8 * P.z[i]) * e; th = .27 + .9 - .5 * eOut3(inv(.9, 1.9, t)); }
  const cs = Math.cos(th), sn = Math.sin(th), dx = P.dx[i], dy = P.dy[i];
  return { x: 960 + (dx * cs - dy * sn) * f, y: 540 + (dx * sn + dy * cs) * f, s: 8 + 22 * P.z[i], a: (.5 + .45 * P.z[i]) * clamp(t / .35), c: P.c[i] };
}
for (let i = 0; i < N; i++){ const d = drift(i, 2); P.s2x[i] = d.x; P.s2y[i] = d.y; P.s2s[i] = d.s; P.s2a[i] = d.a; }
function bokeh(i, t){
  return { x: 960 + (P.ux[i] - 1320) * 2.1, y: 540 + (P.uy[i] - 540) * 2.1 - (t - 7) * 34 * (.5 + P.z[i]), s: 40 + 34 * P.z[i], a: .13, c: P.c[i] };
}
const scanX = t => lerp(840, 1740, eIO(inv(10.2, 11.3, t)));

function pstate(i, t){
  if (t < 2) return drift(i, t);
  if (t < 4.5){
    const d = P.c[i] * .035 + P.r[i] * .12, p = eIO(inv(2 + d, 2.7 + d, t));
    const bend = Math.sin(p * Math.PI) * (P.r[i] - .5) * 260;
    let x = lerp(P.s2x[i], P.ux[i], p) + bend, y = lerp(P.s2y[i], P.uy[i], p) - bend * .4;
    x += Math.sin(t * 1.7 + P.ph[i]) * 2.5 * p; y += Math.cos(t * 1.3 + P.ph[i]) * 2.5 * p;
    return { x, y, s: lerp(P.s2s[i], 11, p), a: lerp(P.s2a[i], .95, p), c: P.c[i] };
  }
  if (t < 7) return null;
  if (t < 9.5){ const b = bokeh(i, t); b.a *= inv(7, 7.35, t); return b; }
  if (t < 12){
    const b = bokeh(i, 9.5);
    if (P.hd[i] < 0){ b.a *= 1 - inv(9.5, 9.8, t); return b.a > 0 ? b : null; }
    const d = clamp((P.hx[i] - 880) / 900) * .35, p = eIO(inv(9.5 + d, 10.15 + d, t));
    const sx = scanX(t), lit = P.hx[i] < sx && t > 10.2;
    let s = lerp(b.s, 19, p), a = lerp(b.a, lit ? .95 : .4, p), c = lit ? P.hd[i] : GRAY;
    if (lit){ const hot = Math.exp(-(sx - P.hx[i]) / 45); s += hot * 22; }
    return { x: lerp(b.x, P.hx[i], p), y: lerp(b.y, P.hy[i], p), s, a, c };
  }
  if (t < 13.5) return null;
  const d = P.r[i] * .35, p = eIO(inv(13.5 + d, 14.0 + d, t));
  const sw = Math.sin(p * Math.PI) * 160 * (P.z[i] - .5);
  let x = lerp(P.rx[i], P.nx[i], p) + sw, y = lerp(P.ry[i], P.ny[i], p) - sw;
  let a = .95, s = 9;
  if (t > 14.35){ const k = t - 14.35; x += (P.nx[i] - 960) * .04 * k; y += (P.ny[i] - 500) * .06 * k; a = .4; s = 14; }
  return { x, y, s, a, c: P.c[i] };
}
function drawParticles(t){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < N; i++){
    const st = pstate(i, t); if (!st || st.a <= .01) continue;
    ctx.globalAlpha = st.a; ctx.drawImage(SPR[st.c], st.x - st.s / 2, st.y - st.s / 2, st.s, st.s);
  }
  ctx.restore();
}

/* ---------- text helpers ---------- */
function font(w, s, fam, style = ''){ ctx.font = `${style} ${w} ${s}px ${fam}`.trim(); }
function tracked(str, x, y, sp, align = 'left', mode = 'fill'){
  const ch = [...str], ws = ch.map(c => ctx.measureText(c).width);
  const w = ws.reduce((a, b) => a + b, 0) + sp * (ch.length - 1);
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.textAlign = 'left';
  ch.forEach((c, k) => { mode === 'fill' ? ctx.fillText(c, cx, y) : ctx.strokeText(c, cx, y); cx += ws[k] + sp; });
  return w;
}
function maskLine(str, x, y, size, p){
  if (p <= 0) return;
  ctx.save(); ctx.beginPath(); ctx.rect(x - 30, y - size * 1.08, W, size * 1.42); ctx.clip();
  ctx.textAlign = 'left'; ctx.fillText(str, x, y + (1 - eOut5(p)) * size * 1.25); ctx.restore();
}
function typeOn(str, x, y, sp, p, align = 'left', cursor = true){
  if (p <= 0) return;
  const n = Math.floor(str.length * clamp(p));
  const w = tracked(str.slice(0, n), x, y, sp, align);
  if (cursor && p < 1.15){
    const fs = parseFloat(ctx.font.match(/(\d+)px/)[1]);
    const bx = align === 'center' ? x + w / 2 + 6 : x + w + 6;
    ctx.fillRect(bx, y - fs * .8, fs * .55, fs * .95);
  }
}
function rr(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rgbSplit(d, alpha, draw){
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ff0000'; draw(-d); ctx.fillStyle = '#00ff00'; draw(0); ctx.fillStyle = '#0000ff'; draw(d);
  ctx.restore();
}

/* ---------- precomputed textures ---------- */
const glowBg = (() => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const gr = g.createRadialGradient(960, 540, 0, 960, 540, 1100); gr.addColorStop(0, 'rgba(40,72,170,.28)'); gr.addColorStop(1, 'rgba(40,72,170,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H); return c; })();
const vign = (() => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const gr = g.createRadialGradient(960, 540, 500, 960, 540, 1250); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.6)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H); return c; })();
const grainPats = [0, 1, 2].map(() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const d = g.createImageData(256, 256); for (let k = 0; k < d.data.length; k += 4){ const v = rnd() * 255; d.data[k] = d.data[k + 1] = d.data[k + 2] = v; d.data[k + 3] = 255; }
  g.putImageData(d, 0, 0); return ctx.createPattern(c, 'repeat'); });

const NAME = T.name, NAME_Y = 500;
function buildNamePts(){
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.font = T.nameFont; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(NAME, 960, NAME_Y);
  const d = g.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += T.nameStep) for (let x = 0; x < W; x += T.nameStep) if (d[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
  if (!pts.length) for (let k = 0; k < 400; k++){ const a = k / 400 * TAU; pts.push([960 + Math.cos(a) * 300, 500 + Math.sin(a) * 180]); }
  for (let k = pts.length - 1; k > 0; k--){ const j = Math.floor(rnd() * (k + 1)); [pts[k], pts[j]] = [pts[j], pts[k]]; }
  for (let i = 0; i < N; i++){ const p = pts[i % pts.length]; P.nx[i] = p[0] + (rnd() - .5) * 3; P.ny[i] = p[1] + (rnd() - .5) * 3; }
}

/* =================================================================== SCENES */

/* 0.0–2.0 · cold open: microscope field, implosion, name slam */
function s1(t){
  const a = eOut3(inv(.05, .5, t)) * (1 - inv(1.6, 1.95, t));
  if (a > 0){
    const r = lerp(520, 360, eOut3(inv(0, .9, t)));
    ctx.save(); ctx.globalAlpha = a * .5; ctx.strokeStyle = HUDC; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(960, 540, r, 0, TAU); ctx.stroke();
    ctx.translate(960, 540); ctx.rotate(t * .4);
    for (let k = 0; k < 72; k++){ ctx.rotate(TAU / 72); const L = k % 6 === 0 ? 20 : 8; ctx.beginPath(); ctx.moveTo(r + 8, 0); ctx.lineTo(r + 8 + L, 0); ctx.stroke(); }
    ctx.restore();
    ctx.save(); ctx.globalAlpha = a * .6; ctx.strokeStyle = HUDC; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(960 - r - 70, 540); ctx.lineTo(960 - r + 40, 540); ctx.moveTo(960 + r - 40, 540); ctx.lineTo(960 + r + 70, 540);
    ctx.moveTo(960, 540 - r - 70); ctx.lineTo(960, 540 - r + 40); ctx.moveTo(960, 540 + r - 40); ctx.lineTo(960, 540 + r + 70); ctx.stroke();
    font(600, 20, F.mono); ctx.fillStyle = HUDC;
    const ch = ['CH1 DAPI 461nm', 'CH2 FITC 520nm', 'CH3 PE 578nm', 'CH4 APC 660nm'];
    ch.forEach((s, k) => typeOn(s, 120, 250 + k * 34, 2, inv(.1 + k * .08, .4 + k * .08, t), 'left', false));
    typeOn('OBJ 40× · NA 0.95', 1800, 250, 2, inv(.15, .45, t), 'right', false);
    typeOn(`FOCUS ${(12.4 - t * 3).toFixed(2)} µm`, 1800, 284, 2, inv(.2, .5, t), 'right', false);
    ctx.restore();
  }
  drawParticles(t);
  if (t >= .9 && t < 1.6){
    const p = eOut3(inv(.9, 1.6, t));
    ctx.save(); ctx.globalAlpha = 1 - p; ctx.strokeStyle = '#fff'; ctx.lineWidth = 46 * (1 - p) + 2;
    ctx.beginPath(); ctx.arc(960, 520, p * 1500, 0, TAU); ctx.stroke(); ctx.restore();
  }
  if (t >= .9){
    ctx.font = T.nameFont; ctx.textBaseline = 'middle';
    const ws = [...NAME].map(c => ctx.measureText(c).width), gap = T.nameGap;
    const tot = ws.reduce((a, b) => a + b, 0) + gap * (ws.length - 1);
    let cx = 960 - tot / 2;
    const d = 28 * (1 - eOut3(inv(.9, 1.5, t))) + 2;
    [...NAME].forEach((c, k) => {
      const lp = inv(.9 + k * T.nameIn, 1.25 + k * T.nameIn, t);

function render(t){
  t = clamp(t, 0, DUR);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const sc = t < 2 ? 1 : t < 4.5 ? 2 : t < 7 ? 3 : t < 9.5 ? 4 : t < 12 ? 5 : t < 13.5 ? 6 : 7;
  if (sc === 3){ ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H); }
  else if (sc === 6){ ctx.fillStyle = BLUE; ctx.fillRect(0, 0, W, H); }
  else { ctx.fillStyle = INK_BG; ctx.fillRect(0, 0, W, H); ctx.drawImage(glowBg, 0, 0); }
  let sx = 0, sy = 0;
  for (const [ti, a] of IMPACTS) if (t >= ti){ const e = Math.exp(-(t - ti) * 10) * a; sx += Math.sin(t * 97 + ti) * e; sy += Math.cos(t * 83 + ti) * e; }
  ctx.save(); ctx.translate(sx, sy);
  [s1, s2, s3, s4, s5, s6, s7][sc - 1](t);
  ctx.restore();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.textAlign = 'left';
  transitions(t);
  hud(t, sc);
  if (sc !== 3 && sc !== 6) ctx.drawImage(vign, 0, 0);
  const fr = Math.floor(t * 24);
  ctx.save(); ctx.globalAlpha = sc === 3 ? .05 : .07; ctx.globalCompositeOperation = 'overlay';
  ctx.translate(-((fr * 97) % 256), -((fr * 57) % 256)); ctx.fillStyle = grainPats[fr % 3]; ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
}

/* =================================================================== SOUND (WebAudio, synthesized) */
let actx = null, master = null, bus = null, noise = null, soundOn = true, audioBase = null;
function ensureAudio(){
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = soundOn ? .8 : 0;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp); comp.connect(actx.destination);
    noise = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e){ actx = null; }
}
function env(g, T, a, dec){ g.gain.setValueAtTime(.0001, T); g.gain.exponentialRampToValueAtTime(a, T + .005); g.gain.exponentialRampToValueAtTime(.0001, T + dec); }
function kick(T, a = 1){ const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(165, T); o.frequency.exponentialRampToValueAtTime(42, T + .14); env(g, T, a, .42); o.connect(g).connect(bus); o.start(T); o.stop(T + .45); }
function nz(T, dur, type, f, q, a, dec){ const s = actx.createBufferSource(); s.buffer = noise; const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const g = actx.createGain(); env(g, T, a, dec); s.connect(fl).connect(g).connect(bus); s.start(T, Math.random()); s.stop(T + dur); }
const hat = (T, a) => nz(T, .06, 'highpass', 8000, .7, a, .045);
const clap = (T, a = .32) => nz(T, .2, 'bandpass', 1700, .9, a, .16);
function tone(T, f, a, dec, type = 'sine'){ const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f; env(g, T, a, dec); o.connect(g).connect(bus); o.start(T); o.stop(T + dec + .02); }
function bass(T, f){ const o = actx.createOscillator(), fl = actx.createBiquadFilter(), g = actx.createGain(); o.type = 'sawtooth'; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 480; env(g, T, .3, .22); o.connect(fl).connect(g).connect(bus); o.start(T); o.stop(T + .25); }
function riser(T0, T1, a = .22){
  const s = actx.createBufferSource(); s.buffer = noise; s.loop = true; const fl = actx.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 5;
  fl.frequency.setValueAtTime(300, T0); fl.frequency.exponentialRampToValueAtTime(7000, T1);
  const g = actx.createGain(); g.gain.setValueAtTime(.0001, T0); g.gain.exponentialRampToValueAtTime(a, T1 - .01); g.gain.linearRampToValueAtTime(0, T1 + .005);
  s.connect(fl).connect(g).connect(bus); s.start(T0); s.stop(T1 + .02);
}
function whoosh(T, len, a = .3){
  const s = actx.createBufferSource(); s.buffer = noise; s.loop = true; const fl = actx.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 2;
  fl.frequency.setValueAtTime(3200, T); fl.frequency.exponentialRampToValueAtTime(260, T + len);
  const g = actx.createGain(); g.gain.setValueAtTime(a, T); g.gain.exponentialRampToValueAtTime(.0001, T + len);
  s.connect(fl).connect(g).connect(bus); s.start(T); s.stop(T + len + .02);
}
function impact(T, a = 1){ kick(T, 1.1 * a); nz(T, 1.2, 'lowpass', 900, .5, .6 * a, 1.0); tone(T, 55, .5 * a, 1.3); }
function pad(T, len){ [220, 277.18, 329.63, 440].forEach((f, k) => { const o = actx.createOscillator(), fl = actx.createBiquadFilter(), g = actx.createGain(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = (k - 1.5) * 6; fl.type = 'lowpass'; fl.frequency.value = 1400; g.gain.setValueAtTime(.0001, T); g.gain.exponentialRampToValueAtTime(.05, T + .04); g.gain.exponentialRampToValueAtTime(.0001, T + len); o.connect(fl).connect(g).connect(bus); o.start(T); o.stop(T + len + .02); }); }
function sweep(T, len){ const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(400, T); o.frequency.exponentialRampToValueAtTime(1600, T + len); g.gain.setValueAtTime(.0001, T); g.gain.exponentialRampToValueAtTime(.05, T + .1); g.gain.exponentialRampToValueAtTime(.0001, T + len); o.connect(g).connect(bus); o.start(T); o.stop(T + len + .02); }

const EV = [];
const ev = (t, fn) => EV.push([t, fn]);
ev(0, T => { tone(T, 55, .25, .9); tone(T, 82.4, .12, .9); });
ev(.2, T => riser(T, T + .7, .3));
ev(.9, T => impact(T, 1));
[1.1, 1.2, 1.3, 1.4].forEach((x, k) => ev(x, T => tone(T, 1760 + k * 220, .06, .06)));
ev(1.5, T => riser(T, T + .5, .2));
const BN = [55, 55, 65.41, 49];
for (let b = 2; b < 13.49; b += .5){
  const n = Math.round((b - 2) / .5);
  ev(b, T => kick(T, .95));
  if (n & 1) ev(b, T => clap(T));
  ev(b + .25, T => bass(T, BN[Math.floor(n / 2) % 4]));
}
for (let h = 2; h < 13.49; h += .125){ const k = Math.round((h - 2) / .125); ev(h, T => hat(T, k % 2 ? .05 : .1)); }
[4.5, 7.0, 9.5, 12.0].forEach(c => ev(c - .5, T => riser(T, T + .5, .18)));
ev(4.5, T => impact(T, .6));
[4.5, 5.0, 5.5, 6.0].forEach((s, k) => { for (let j = 0; j < 5; j++) ev(s + .03 + j * .055, T => tone(T, 880 * Math.pow(1.12, j + k * 2), .05, .05, 'square')); });
ev(6.5, T => clap(T, .45));
ev(7.0, T => whoosh(T, 1.5, .28));
ev(8.6, T => { clap(T, .5); tone(T, 1320, .1, .25, 'triangle'); });
ev(10.2, T => sweep(T, 1.1));
ev(12.0, T => whoosh(T, 1.4, .3));
ev(13.5, T => riser(T, T + .85, .32));
ev(14.35, T => { impact(T, 1.2); pad(T, 1.2); });

function scheduleFrom(t0){
  if (!actx) return;
  stopAudio();
  bus = actx.createGain(); bus.connect(master);
  const T0 = actx.currentTime + .06; audioBase = { T0, t0 };
  for (const [et, fn] of EV) if (et >= t0 - .001) fn(T0 + (et - t0));
}
function stopAudio(){ if (bus){ try { bus.disconnect(); } catch (e){} bus = null; } audioBase = null; }

/* =================================================================== PLAYER
   No visible controls. Autoplays muted and loops (browsers block sound until a gesture);
   the first click or key restarts from 0:00 with sound. Space pauses, arrows step 0.5 s,
   F toggles fullscreen, M mutes. ?t=<sec> opens paused on that frame. */
const $ = id => document.getElementById(id);
const stage = $('stage');
const qT = parseFloat(new URLSearchParams(location.search).get('t'));
const still = Number.isFinite(qT);
if (EN){ document.documentElement.lang = 'en'; document.title = 'Seong-Jun Kang Showreel'; cv.setAttribute('aria-label', 'Seong-Jun Kang 15-second showreel'); }
let playing = false, playhead = still ? clamp(qT, 0, DUR) : 0, lastPerf = 0, dirty = true, armed = false, holdUntil = 0;
function play(){
  if (actx && actx.state === 'suspended') actx.resume();
  if (playhead >= DUR - .01) playhead = 0;
  scheduleFrom(playhead); playing = true; lastPerf = performance.now();
}
function pause(){ playing = false; stopAudio(); dirty = true; }
function seek(t){ playhead = clamp(t, 0, DUR); if (playing) scheduleFrom(playhead); dirty = true; }
function arm(){
  if (armed) return; armed = true;
  ensureAudio(); if (actx && actx.state === 'suspended') actx.resume();
  playhead = 0; play();
}
function loop(now){
  if (playing){
    if (actx && actx.state === 'running' && audioBase) playhead = Math.max(audioBase.t0, audioBase.t0 + (actx.currentTime - audioBase.T0));
    else playhead += (now - lastPerf) / 1000;
    lastPerf = now;
    if (playhead >= DUR){ playhead = DUR; playing = false; stopAudio(); holdUntil = now + 1200; }
    render(playhead);
  } else if (holdUntil && now >= holdUntil){ holdUntil = 0; playhead = 0; play(); }
  else if (dirty){ render(playhead); dirty = false; }
  requestAnimationFrame(loop);
}
function toggleFs(){
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
  } catch (e){}
}
stage.addEventListener('click', () => { if (!armed) arm(); else playing ? pause() : (holdUntil = 0, play()); });
stage.addEventListener('dblclick', toggleFs);
document.addEventListener('keydown', e => {
  if (!armed){ arm(); if (e.key === ' ') e.preventDefault(); return; }
  if (e.key === ' '){ e.preventDefault(); playing ? pause() : (holdUntil = 0, play()); }
  else if (e.key === 'ArrowRight') seek(playhead + .5);
  else if (e.key === 'ArrowLeft') seek(playhead - .5);
  else if (e.key === 'f' || e.key === 'F') toggleFs();
  else if (e.key === 'm' || e.key === 'M'){ soundOn = !soundOn; if (master) master.gain.setTargetAtTime(soundOn ? .8 : 0, actx.currentTime, .02); }
});
let idleT; document.addEventListener('mousemove', () => { stage.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => stage.classList.add('idle'), 1500); });

/* frame-accurate hook for offline capture: reel.renderAt(t) */
window.reel = { renderAt: t => render(t), duration: DUR, fps: 30 };

const KO = '강성준계산면역학자실험단일세포공간데이터분석일차부터다중모달까지연구정체성편의논문제공동저자명공여자아틀라스산업과제기획수행성과게재저널측정모델경력성균관대학교유전공학학사서울의과석사이식소전문요원영장류매니저항박사원주후딥러닝다음챕터중·';
const loads = [
  `400 100px "Black Han Sans"`, `900 100px "Noto Sans KR"`, `700 100px "Noto Sans KR"`, `400 100px "Noto Sans KR"`,
  `800 100px "Plus Jakarta Sans"`, `italic 800 100px "Plus Jakarta Sans"`, `600 100px "JetBrains Mono"`
].map(f => document.fonts ? document.fonts.load(f, KO + 'ABCabc0123456789$+×µØ⁺′') : Promise.resolve());
Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 4000))]).catch(() => {}).then(() => {
  buildNamePts(); dirty = true; if (!still) play(); requestAnimationFrame(loop);
});
render(playhead);
})();
</script>
