# The download button used to point at a PDF rendered by hand. Every edit to index.html
# left it one revision behind, and at one point the page described one lab while the file
# described another. This renders the PDF from index.html on every push instead.
#
# There is now more than one CV page: a general one at the site root and one per application
# under for-<something>/. They are all rendered by the same job, from the list below, which
# Seong-Jun-CV-for-labs/build.py prints for you. Note the paths filter is for-*/ and not
# for-*-lab/: the Jameel Clinic page is not a lab and would not have matched.
name: Render CV PDF

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'for-*/index.html'
      - 'release-assets/**'
      - '.github/workflows/render-cv-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-cv-pdf
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Render each page to PDF
        run: |
          set -eu
          # "<source html>|<output pdf>", one pair per line.
          PAGES='index.html|Seong-Jun-Kang-CV.pdf
          for-jameel-clinic/index.html|for-jameel-clinic/Seong-Jun-Kang-CV-Jameel.pdf
          for-keating-lab/index.html|for-keating-lab/Seong-Jun-Kang-CV-Keating.pdf
          for-bathe-lab/index.html|for-bathe-lab/Seong-Jun-Kang-CV-Bathe.pdf
          for-joshi-lab/index.html|for-joshi-lab/Seong-Jun-Kang-CV-Joshi.pdf
          for-hyman-lab/index.html|for-hyman-lab/Seong-Jun-Kang-CV-Hyman.pdf'

          # The book bibliography includes its original title and author names.
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils fonts-noto-cjk

          echo "$PAGES" | while IFS='|' read -r SRC OUT; do
            SRC=$(echo "$SRC" | xargs); OUT=$(echo "$OUT" | xargs)
            echo "::group::$SRC -> $OUT"
            # virtual-time-budget gives the webfont time to arrive; without it the first
            # render can come out in the fallback face.
            "$(which chrome || which google-chrome)" \
              --headless --disable-gpu --no-sandbox \
              --no-pdf-header-footer \
              --virtual-time-budget=15000 \
              --print-to-pdf="$OUT" \
              "file://$GITHUB_WORKSPACE/$SRC"

            pdfinfo "$OUT"
            # @page sets 13mm side margins. A render that ignores them puts ink at x=0,
            # which is the failure this file exists to prevent, so fail the job instead
            # of committing it.
            LEFT=$(pdftotext -bbox -f 1 -l 1 "$OUT" - \
                   | grep -o 'xMin="[0-9.]*"' | grep -o '[0-9.]*' | sort -g | head -1)
            echo "left margin: ${LEFT}pt"
            awk -v l="$LEFT" 'BEGIN { if (l < 20) { print "margins were dropped"; exit 1 } }'
            echo "::endgroup::"
          done

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Seong-Jun-Kang-CV.pdf for-*/*.pdf
          git diff --staged --quiet && echo "PDFs unchanged" && exit 0
          git commit -m "Re-render the CV PDFs from their pages"
          git push
